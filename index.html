<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Lớp 8 Siêu Cấp</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; padding: 10px; background: #2d2d2d; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 10px; padding: 0 10px; }
        canvas { background: #4ec0ca; display: block; margin: 0 auto; border-radius: 5px; border: 2px solid #fff; cursor: pointer; }
        .instruction { font-size: 13px; color: #aaa; margin-top: 10px; }
        button { background: #1f883d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; display: none; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats">
            <div>Điểm: <span id="scoreText">0</span></div>
            <div>Độ khó: <span id="levelText">1</span></div>
        </div>
        <canvas id="gameCanvas" width="320" height="480"></canvas>
        <div class="instruction">Bấm chuột vào khung game hoặc nhấn phím CÁCH (Space) để chim bay lên!</div>
        <button id="restartBtn" onclick="resetGame()">Chơi lại từ đầu</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("scoreText");
        const levelText = document.getElementById("levelText");
        const restartBtn = document.getElementById("restartBtn");

        // Cấu hình Chim
        let bird = { x: 50, y: 150, width: 34, height: 24, gravity: 0.25, jump: 5, velocity: 0 };
        
        // Cấu hình Ống cống
        let pipes = [];
        let pipeWidth = 52;
        let pipeGap = 120; 
        let pipeSpeed = 2;
        let frameCount = 0;
        let score = 0;
        let gameOver = false;

        function createPipe() {
            let minHeight = 50;
            let maxHeight = canvas.height - pipeGap - minHeight;
            let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            pipes.push({ x: canvas.width, top: height, bottom: canvas.height - height - pipeGap, passed: false });
        }

        function drawBird() {
            // Thân chim màu vàng
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
            // Mỏ chim màu cam
            ctx.fillStyle = "#e67e22";
            ctx.fillRect(bird.x + bird.width - 8, bird.y + 6, 8, 8);
            // Mắt chim
            ctx.fillStyle = "#000";
            ctx.fillRect(bird.x + bird.width - 12, bird.y + 4, 4, 4);
        }

        function drawPipes() {
            ctx.fillStyle = "#2ecc71"; 
            pipes.forEach(pipe => {
                // Ống trên
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.strokeStyle = "#27ae60";
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);

                // Ống dưới
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            });
        }

        function update() {
            if (gameOver) return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.y + bird.height >= canvas.height || bird.y <= 0) {
                endGame();
            }

            if (frameCount % 100 === 0) { createPipe(); }
            frameCount++;

            pipes.forEach(pipe => {
                pipe.x -= pipeSpeed;

                if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
                    score++;
                    pipe.passed = true;
                    scoreText.innerText = score;
                    levelText.innerText = Math.floor(score / 5) + 1;
                    pipeSpeed = 2 + Math.floor(score / 5) * 0.5; 
                }

                if (bird.x < pipe.x + pipeWidth && bird.x + bird.width > pipe.x &&
                    (bird.y < pipe.top || bird.y + bird.height > canvas.height - pipe.bottom)) {
                    endGame();
                }
            });

            if (pipes.length > 0 && pipes[0].x < -pipeWidth) { pipes.shift(); }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPipes();
            drawBird();

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4757";
                ctx.font = "bold 24px Arial";
                ctx.fillText("GAME OVER", canvas.width/2 - 70, canvas.height/2);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function jumpAction() {
            if (!gameOver) { bird.velocity = -bird.jump; }
        }

        function endGame() {
            gameOver = true;
            restartBtn.style.display = "inline-block";
        }

        // Đóng góp từ học sinh lớp 8 sửa nút chơi lại
        function resetGame() {
            bird = { x: 50, y: 150, width: 34, height: 24, gravity: 0.25, jump: 5, velocity: 0 };
            pipes = [];
            frameCount = 0;
            score = 0;
            pipeSpeed = 2;
            gameOver = false;
            scoreText.innerText = score;
            levelText.innerText = 1;
            restartBtn.style.display = "none";
        }

        window.addEventListener("keydown", (e) => { if(e.code === "Space") jumpAction(); });
        canvas.addEventListener("click", jumpAction);

        gameLoop();
    </script>
</body>
</html>
